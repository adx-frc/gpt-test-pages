<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT Test Page - hor_display1</title>

  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 22px;
    }

    .ad-wrap {
      margin: 24px 0;
      padding: 16px;
      background: #fff;
      border: 1px solid #ddd;
    }

    #div-gpt-ad-1777562592509-0 {
      min-width: 728px;
      min-height: 90px;
      background: #fafafa;
      border: 1px dashed #bbb;
    }

    .debug-panel {
      margin-top: 24px;
      padding: 16px;
      background: #111827;
      color: #f9fafb;
      border-radius: 8px;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .debug-panel a {
      color: #93c5fd;
    }

    .label {
      color: #a7f3d0;
    }
  </style>
</head>

<body>
  <h1>Google Ad Manager GPT Test Page</h1>

  <div class="ad-wrap">
    <!-- /22908122590,23338557499/surl.lu/hor_display1 -->
    <div id="div-gpt-ad-1777562592509-0"></div>
    <script>
      window.googletag = window.googletag || { cmd: [] };
      googletag.cmd.push(function() {
        googletag.display("div-gpt-ad-1777562592509-0");
      });
    </script>
  </div>

  <div id="debug-panel" class="debug-panel">Loading GPT debug info...</div>

  <script>
    window.googletag = window.googletag || { cmd: [] };

    var GPT_TEST = {
      pageUrl: "https://surl.lu/ads-test-page",
      divId: "div-gpt-ad-1777562592509-0",
      definedSizes: [[1080, 260], [728, 90]],
      requestedSizes: [[1080, 260], [728, 90]],
      adUnitPath: "",
      networkId: "",
      lineItemId: "",
      creativeId: "",
      advertiserId: "",
      campaignId: "",
      renderedSize: "",
      isEmpty: "",
      slot: null
    };

    function formatSizes(sizes) {
      if (!sizes || !sizes.length) {
        return "None";
      }

      return sizes.map(function(size) {
        if (Array.isArray(size)) {
          return size[0] + "x" + size[1];
        }
        return String(size);
      }).join(", ");
    }

    function htmlEscape(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderIdWithLink(label, id, url) {
      if (!id) {
        return '<span class="label">' + label + ':</span> N/A';
      }

      return '<span class="label">' + label + ':</span> ' +
        htmlEscape(id) +
        ' — <a href="' + htmlEscape(url) + '" target="_blank" rel="noopener">Open in GAM</a>';
    }

    function updateRequestedSizes() {
      /*
        No sizeMapping is used on this page.
        Required logic:
        If no sizeMapping: requested sizes = defined sizes.
      */
      GPT_TEST.requestedSizes = GPT_TEST.definedSizes;
    }

    function renderDebugPanel() {
      updateRequestedSizes();

      var viewport = window.innerWidth + "x" + window.innerHeight;

      var lineItemUrl = GPT_TEST.networkId && GPT_TEST.lineItemId
        ? "https://admanager.google.com/" + GPT_TEST.networkId + "#delivery/line_item/detail/" + GPT_TEST.lineItemId
        : "";

      var creativeUrl = GPT_TEST.networkId && GPT_TEST.creativeId
        ? "https://admanager.google.com/" + GPT_TEST.networkId + "#delivery/creative/detail/" + GPT_TEST.creativeId
        : "";

      var campaignUrl = GPT_TEST.networkId && GPT_TEST.campaignId
        ? "https://admanager.google.com/" + GPT_TEST.networkId + "#delivery/order/detail/" + GPT_TEST.campaignId
        : "";

      var panelHtml = ""
        + '<span class="label">Network ID:</span> ' + htmlEscape(GPT_TEST.networkId || "N/A") + "\n"
        + '<span class="label">Ad unit path:</span> ' + htmlEscape(GPT_TEST.adUnitPath || "N/A") + "\n"
        + '<span class="label">page_url:</span> ' + htmlEscape(GPT_TEST.pageUrl) + "\n"
        + '<span class="label">Div ID:</span> ' + htmlEscape(GPT_TEST.divId) + "\n"
        + '<span class="label">Defined sizes:</span> ' + htmlEscape(formatSizes(GPT_TEST.definedSizes)) + "\n"
        + '<span class="label">Requested sizes current request:</span> ' + htmlEscape(formatSizes(GPT_TEST.requestedSizes)) + "\n"
        + '<span class="label">Viewport:</span> ' + htmlEscape(viewport) + "\n"
        + '<span class="label">Rendered size:</span> ' + htmlEscape(GPT_TEST.renderedSize || "N/A") + "\n"
        + '<span class="label">Is empty:</span> ' + htmlEscape(GPT_TEST.isEmpty === "" ? "N/A" : GPT_TEST.isEmpty) + "\n"
        + renderIdWithLink("Campaign/Order ID", GPT_TEST.campaignId, campaignUrl) + "\n"
        + renderIdWithLink("Line item ID", GPT_TEST.lineItemId, lineItemUrl) + "\n"
        + renderIdWithLink("Creative ID", GPT_TEST.creativeId, creativeUrl) + "\n"
        + '<span class="label">Advertiser ID:</span> ' + htmlEscape(GPT_TEST.advertiserId || "N/A") + "\n\n"
        + "DevTools → Network/Console (filter gpt/doubleclick).";

      document.getElementById("debug-panel").innerHTML = panelHtml;
    }

    function debounce(fn, delay) {
      var timer = null;
      return function() {
        clearTimeout(timer);
        timer = setTimeout(fn, delay);
      };
    }

    googletag.cmd.push(function() {
      var slot = googletag.defineSlot(
        "/22908122590,23338557499/surl.lu/hor_display1",
        [[1080, 260], [728, 90]],
        "div-gpt-ad-1777562592509-0"
      ).addService(googletag.pubads());

      GPT_TEST.slot = slot;

      var adUnitPath = slot.getAdUnitPath();
      var networkId = (adUnitPath.match(/^\/(\d+)\//) || [])[1] || "";

      GPT_TEST.adUnitPath = adUnitPath;
      GPT_TEST.networkId = networkId;

      googletag.pubads().set("page_url", "https://surl.lu/ads-test-page");

      googletag.pubads().enableSingleRequest();
      googletag.pubads().collapseEmptyDivs();

      googletag.pubads().addEventListener("slotRenderEnded", function(e) {
        if (e.slot !== slot) {
          return;
        }

        GPT_TEST.lineItemId = e.lineItemId || "";
        GPT_TEST.creativeId = e.creativeId || "";
        GPT_TEST.advertiserId = e.advertiserId || "";
        GPT_TEST.campaignId = e.campaignId || "";

        if (Array.isArray(e.size)) {
          GPT_TEST.renderedSize = e.size[0] + "x" + e.size[1];
        } else {
          GPT_TEST.renderedSize = e.size || "";
        }

        GPT_TEST.isEmpty = String(e.isEmpty);

        renderDebugPanel();
      });

      googletag.enableServices();

      renderDebugPanel();
    });

    window.addEventListener("load", renderDebugPanel);
    window.addEventListener("resize", debounce(renderDebugPanel, 150));
  </script>
</body>
</html>
